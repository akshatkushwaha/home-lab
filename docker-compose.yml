x-common-env: &common-env
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}
  TZ: ${TZ:-UTC}

networks:
  private_net:
    driver: bridge
  shared_net:
    driver: bridge
  media_bridge:
    driver: bridge

services:

  # --------------------------------------------------
  # REVERSE PROXY AND CONTAINER MANAGEMENT
  # --------------------------------------------------
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    ports:
      - "${PRIVATE_IP:?Set PRIVATE_IP in .env}:80:80"     # Private HTTP
      - "${PRIVATE_IP:?Set PRIVATE_IP in .env}:81:81"     # Private Admin Web UI
      - "${PRIVATE_IP:?Set PRIVATE_IP in .env}:443:443"   # Private HTTPS and SSL
    volumes:
      - ./configs/npm/data:/data
      - ./configs/npm/letsencrypt:/etc/letsencrypt
    networks:
      - private_net
    restart: unless-stopped

  npm-shared:
    image: jc21/nginx-proxy-manager:latest
    container_name: npm-shared
    ports:
      - "${SHARED_IP:?Set SHARED_IP in .env}:80:80"       # Shared HTTP
      - "${SHARED_IP:?Set SHARED_IP in .env}:443:443"     # Shared HTTPS and SSL
      - "${PRIVATE_IP:?Set PRIVATE_IP in .env}:8181:81"   # Admin Web UI on Private IP only
    volumes:
      - ./configs/npm-shared/data:/data
      - ./configs/npm-shared/letsencrypt:/etc/letsencrypt
    networks:
      - shared_net
    restart: unless-stopped

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    ports:
      - "${PRIVATE_IP:?Set PRIVATE_IP in .env}:8000:8000"
      - "${PRIVATE_IP:?Set PRIVATE_IP in .env}:9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./configs/portainer/data:/data
    networks:
      - private_net
    restart: unless-stopped

  # --------------------------------------------------
  # SECURITY AND PASSWORDS
  # --------------------------------------------------
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    environment:
      DOMAIN: ${VAULTWARDEN_DOMAIN:?Set VAULTWARDEN_DOMAIN in .env}
      SIGNUPS_ALLOWED: ${VAULTWARDEN_SIGNUPS_ALLOWED:-false}
      TZ: ${TZ:-UTC}
    volumes:
      - ./configs/vaultwarden/data:/data
    networks:
      - shared_net
    restart: unless-stopped

  # --------------------------------------------------
  # PHOTOS AND BACKUPS (IMMICH)
  # --------------------------------------------------
  immich-server:
    image: ghcr.io/immich-app/immich-server:release
    container_name: immich-server
    ports:
      - "${SHARED_IP:?Set SHARED_IP in .env}:2283:2283"
    environment:
      DB_HOSTNAME: immich-database
      DB_USERNAME: postgres
      DB_PASSWORD: ${IMMICH_DB_PASSWORD:?Set IMMICH_DB_PASSWORD in .env}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich-redis
      TZ: ${TZ:-UTC}
    volumes:
      - ${PHOTOS_DIR:-~/photos}:/usr/src/app/upload
    depends_on:
      - immich-database
      - immich-redis
      - immich-machine-learning
    networks:
      - shared_net
    restart: unless-stopped

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:release
    container_name: immich-machine-learning
    volumes:
      - ${MEDIA_DIR:-~/media}/cache/immich-ml:/cache
    networks:
      - shared_net
    restart: unless-stopped

  immich-redis:
    image: redis:7-alpine
    container_name: immich-redis
    networks:
      - shared_net
    restart: unless-stopped

  immich-database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    container_name: immich-database
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD:?Set IMMICH_DB_PASSWORD in .env}
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ./configs/immich/postgres:/var/lib/postgresql/data
    shm_size: 128mb
    networks:
      - shared_net
    restart: unless-stopped

  # --------------------------------------------------
  # DOCUMENT MANAGEMENT AND UTILITIES
  # --------------------------------------------------
  paperless-ngx:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless-ngx
    environment:
      <<: *common-env
      USERMAP_UID: ${PUID:-1000}
      USERMAP_GID: ${PGID:-1000}
      PAPERLESS_REDIS: redis://paperless-redis:6379
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:?Set PAPERLESS_SECRET_KEY in .env}
      PAPERLESS_URL: ${PAPERLESS_URL:-http://localhost:8777}
      PAPERLESS_CSRF_TRUSTED_ORIGINS: ${PAPERLESS_CSRF_TRUSTED_ORIGINS:-http://localhost:8777}
      PAPERLESS_ALLOWED_HOSTS: ${PAPERLESS_ALLOWED_HOSTS:-localhost,127.0.0.1}
      PAPERLESS_TIME_ZONE: ${TZ:-UTC}
      PAPERLESS_OCR_LANGUAGE: eng
    volumes:
      - ./configs/paperless/data:/usr/src/paperless/data
      - ./configs/paperless/media:/usr/src/paperless/media
      - ./configs/paperless/export:/usr/src/paperless/export
      - ./configs/paperless/consume:/usr/src/paperless/consume
    ports:
      - "${PRIVATE_IP:?Set PRIVATE_IP in .env}:8777:8000"
    depends_on:
      - paperless-redis
    networks:
      - private_net
    restart: unless-stopped

  paperless-redis:
    image: redis:7-alpine
    container_name: paperless-redis
    networks:
      - private_net
    restart: unless-stopped

  stirling-pdf:
    image: stirlingtools/stirling-pdf:latest
    container_name: stirling-pdf
    environment:
      - DOCKER_ENABLE_SECURITY=${STIRLING_ENABLE_SECURITY:-false}
      - TZ=${TZ:-UTC}
    ports:
      - "${PRIVATE_IP:?Set PRIVATE_IP in .env}:8085:8080"
    volumes:
      - ./configs/stirling-pdf/trainingData:/usr/share/tessdata
      - ./configs/stirling-pdf/extraConfigs:/configs
    networks:
      - private_net
    restart: unless-stopped

  # --------------------------------------------------
  # FILE SYNC AND STORAGE (SYNCTHING)
  # --------------------------------------------------
  syncthing:
    image: lscr.io/linuxserver/syncthing:latest
    container_name: syncthing
    hostname: homeserver-syncthing
    environment:
      <<: *common-env
    volumes:
      - ./configs/syncthing/config:/config
      - ${STORAGE_DIR:-~/storage}:/storage
    ports:
      - "${PRIVATE_IP:?Set PRIVATE_IP in .env}:8384:8384"       # Web UI
      - "${PRIVATE_IP:?Set PRIVATE_IP in .env}:22000:22000/tcp" # TCP listen port
      - "${PRIVATE_IP:?Set PRIVATE_IP in .env}:22000:22000/udp" # UDP listen port
      - "${PRIVATE_IP:?Set PRIVATE_IP in .env}:21027:21027/udp" # Discovery port
    networks:
      - private_net
    restart: unless-stopped

  # --------------------------------------------------
  # MONITORING AND HOMEPAGE
  # --------------------------------------------------
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    volumes:
      - ./configs/uptime-kuma/data:/app/data
    ports:
      - "${PRIVATE_IP:?Set PRIVATE_IP in .env}:3001:3001"
    networks:
      - private_net
    restart: unless-stopped

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    environment:
      - TZ=${TZ:-UTC}
      - HOMEPAGE_VAR_SERVER_IP=${PRIVATE_IP:-127.0.0.1}
      - HOMEPAGE_VAR_SHARED_IP=${SHARED_IP:-127.0.0.1}
      - HOMEPAGE_VAR_VAULT_URL=${VAULTWARDEN_DOMAIN:-http://localhost}
    volumes:
      - ./configs/homepage/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "${PRIVATE_IP:?Set PRIVATE_IP in .env}:3000:3000"
    networks:
      - private_net
    restart: unless-stopped

  # --------------------------------------------------
  # MEDIA STREAMING AND AUTOMATION (JELLYFIN AND *ARR STACK)
  # --------------------------------------------------
  # ZFS Snapshot and Storage Architecture:
  # 1. Configs and Databases:
  #    ./configs/<service> maps to the ZFS config dataset (tank/appdata).
  #    Snapshots stay small, run fast, and replicate offsite.
  # 2. Bulk Media and Downloads:
  #    ${MEDIA_DIR:-~/media} maps to a separate ZFS media dataset (tank/media).
  #    Routine config backup snapshots do not include this dataset.
  # 3. Jellyfin and Immich Cache Isolation:
  #    ${MEDIA_DIR:-~/media}/cache/... keeps large transcode chunks and ML models
  #    out of ./configs so snapshots stay small.
  # 4. TRaSH Guides Hardlink Structure:
  #    One shared root (${MEDIA_DIR:-~/media}:/data) across qBittorrent, Sonarr,
  #    and Radarr lets the kernel make instant atomic hardlinks with zero extra space.
  # 5. Network Isolation:
  #    Private admin containers run on private_net and map to PRIVATE_IP.
  #    Shared media containers run on shared_net and map to SHARED_IP.
  #    media_bridge connects only Jellyseerr to Radarr and Sonarr.
  # --------------------------------------------------

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      LOG_LEVEL: info
      TZ: ${TZ:-UTC}
    ports:
      - "${PRIVATE_IP:?Set PRIVATE_IP in .env}:8191:8191"
    networks:
      - private_net
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      <<: *common-env
      WEBUI_PORT: 8080
    volumes:
      - ./configs/qbittorrent:/config
      - ${MEDIA_DIR:-~/media}:/data
    ports:
      - "${PRIVATE_IP:?Set PRIVATE_IP in .env}:8080:8080" # Web UI
      - 6881:6881
      - 6881:6881/udp
    networks:
      - private_net
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      <<: *common-env
    volumes:
      - ./configs/prowlarr:/config
    ports:
      - "${PRIVATE_IP:?Set PRIVATE_IP in .env}:9696:9696"
    networks:
      - private_net
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      <<: *common-env
    volumes:
      - ./configs/sonarr:/config
      - ${MEDIA_DIR:-~/media}:/data
    ports:
      - "${PRIVATE_IP:?Set PRIVATE_IP in .env}:8989:8989"
    networks:
      - private_net
      - media_bridge
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      <<: *common-env
    volumes:
      - ./configs/radarr:/config
      - ${MEDIA_DIR:-~/media}:/data
    ports:
      - "${PRIVATE_IP:?Set PRIVATE_IP in .env}:7878:7878"
    networks:
      - private_net
      - media_bridge
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      <<: *common-env
    volumes:
      - ./configs/bazarr:/config
      - ${MEDIA_DIR:-~/media}:/data
    ports:
      - "${PRIVATE_IP:?Set PRIVATE_IP in .env}:6767:6767"
    networks:
      - private_net
    restart: unless-stopped

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      <<: *common-env
    volumes:
      - ./configs/jellyfin:/config
      - ./configs/jellyfin/custom-cont-init.d:/custom-cont-init.d
      - ${MEDIA_DIR:-~/media}/cache/jellyfin:/cache
      - ${MEDIA_DIR:-~/media}/movies:/data/movies:ro
      - ${MEDIA_DIR:-~/media}/tv:/data/tv:ro
    ports:
      - "${SHARED_IP:?Set SHARED_IP in .env}:8096:8096"
    # devices:
    #   - /dev/dri:/dev/dri # Intel QuickSync and VAAPI hardware transcode
    networks:
      - shared_net
    restart: unless-stopped

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ./configs/jellyseerr:/app/config
    ports:
      - "${SHARED_IP:?Set SHARED_IP in .env}:5055:5055"
    networks:
      - shared_net
      - media_bridge
    restart: unless-stopped
