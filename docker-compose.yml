x-common-env: &common-env
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}
  TZ: ${TZ:-UTC}

services:

  # --------------------------------------------------
  # REVERSE PROXY & CONTAINER MANAGEMENT
  # --------------------------------------------------
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    ports:
      - "80:80"      # Public HTTP
      - "81:81"      # Admin Web UI
      - "443:443"    # Public HTTPS / SSL
    volumes:
      - ./configs/npm/data:/data
      - ./configs/npm/letsencrypt:/etc/letsencrypt
    restart: unless-stopped

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    ports:
      - 8000:8000
      - 9443:9443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./configs/portainer/data:/data
    restart: unless-stopped

  # --------------------------------------------------
  # SECURITY & PASSWORDS
  # --------------------------------------------------
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    environment:
      DOMAIN: ${VAULTWARDEN_DOMAIN:?Set VAULTWARDEN_DOMAIN in .env}
      SIGNUPS_ALLOWED: ${VAULTWARDEN_SIGNUPS_ALLOWED:-false}
      TZ: ${TZ:-UTC}
    volumes:
      - ./configs/vaultwarden/data:/data
    restart: unless-stopped

  # --------------------------------------------------
  # PHOTOS & BACKUPS (IMMICH)
  # --------------------------------------------------
  immich-server:
    image: ghcr.io/immich-app/immich-server:release
    container_name: immich-server
    ports:
      - 2283:2283
    environment:
      DB_HOSTNAME: immich-database
      DB_USERNAME: postgres
      DB_PASSWORD: ${IMMICH_DB_PASSWORD:?Set IMMICH_DB_PASSWORD in .env}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich-redis
      TZ: ${TZ:-UTC}
    volumes:
      - ${PHOTOS_DIR:-~/photos}:/usr/src/app/upload
    depends_on:
      - immich-database
      - immich-redis
      - immich-machine-learning
    restart: unless-stopped

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:release
    container_name: immich-machine-learning
    volumes:
      - ${MEDIA_DIR:-~/media}/cache/immich-ml:/cache
    restart: unless-stopped

  immich-redis:
    image: redis:7-alpine
    container_name: immich-redis
    restart: unless-stopped

  immich-database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    container_name: immich-database
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD:?Set IMMICH_DB_PASSWORD in .env}
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ./configs/immich/postgres:/var/lib/postgresql/data
    shm_size: 128mb
    restart: unless-stopped

  # --------------------------------------------------
  # DOCUMENT MANAGEMENT & UTILITIES
  # --------------------------------------------------
  paperless-ngx:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless-ngx
    environment:
      <<: *common-env
      USERMAP_UID: ${PUID:-1000}
      USERMAP_GID: ${PGID:-1000}
      PAPERLESS_REDIS: redis://paperless-redis:6379
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:?Set PAPERLESS_SECRET_KEY in .env}
      PAPERLESS_URL: ${PAPERLESS_URL:-http://localhost:8777}
      PAPERLESS_CSRF_TRUSTED_ORIGINS: ${PAPERLESS_CSRF_TRUSTED_ORIGINS:-http://localhost:8777}
      PAPERLESS_ALLOWED_HOSTS: ${PAPERLESS_ALLOWED_HOSTS:-localhost,127.0.0.1}
      PAPERLESS_TIME_ZONE: ${TZ:-UTC}
      PAPERLESS_OCR_LANGUAGE: eng
    volumes:
      - ./configs/paperless/data:/usr/src/paperless/data
      - ./configs/paperless/media:/usr/src/paperless/media
      - ./configs/paperless/export:/usr/src/paperless/export
      - ./configs/paperless/consume:/usr/src/paperless/consume
    ports:
      - 8777:8000
    depends_on:
      - paperless-redis
    restart: unless-stopped

  paperless-redis:
    image: redis:7-alpine
    container_name: paperless-redis
    restart: unless-stopped

  stirling-pdf:
    image: stirlingtools/stirling-pdf:latest
    container_name: stirling-pdf
    environment:
      - DOCKER_ENABLE_SECURITY=${STIRLING_ENABLE_SECURITY:-false}
      - TZ=${TZ:-UTC}
    ports:
      - 8085:8080
    volumes:
      - ./configs/stirling-pdf/trainingData:/usr/share/tessdata
      - ./configs/stirling-pdf/extraConfigs:/configs
    restart: unless-stopped

  # --------------------------------------------------
  # FILE SYNC & STORAGE (SYNCTHING)
  # --------------------------------------------------
  syncthing:
    image: lscr.io/linuxserver/syncthing:latest
    container_name: syncthing
    hostname: homeserver-syncthing
    environment:
      <<: *common-env
    volumes:
      - ./configs/syncthing/config:/config
      - ${STORAGE_DIR:-~/storage}:/storage
    ports:
      - 8384:8384       # Web UI
      - 22000:22000/tcp # Listening port TCP
      - 22000:22000/udp # Listening port UDP
      - 21027:21027/udp # Discovery port
    restart: unless-stopped

  # --------------------------------------------------
  # MONITORING & HOMEPAGE
  # --------------------------------------------------
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    volumes:
      - ./configs/uptime-kuma/data:/app/data
    ports:
      - 3001:3001
    restart: unless-stopped

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    environment:
      - TZ=${TZ:-UTC}
      - HOMEPAGE_VAR_SERVER_IP=${SERVER_IP:-127.0.0.1}
      - HOMEPAGE_VAR_VAULT_URL=${VAULTWARDEN_DOMAIN:-http://localhost}
    volumes:
      - ./configs/homepage/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - 3000:3000
    restart: unless-stopped

  # --------------------------------------------------
  # MEDIA STREAMING & AUTOMATION (JELLYFIN & *ARR STACK)
  # --------------------------------------------------
  # ZFS Snapshot & Storage Architecture:
  # 1. Configs & Databases:
  #    ./configs/<service> -> ZFS config dataset (tank/appdata).
  #    Snapshots are lightweight (MBs/GBs), fast, and safely replicated offsite.
  # 2. Bulk Media & Downloads:
  #    ${MEDIA_DIR:-~/media} -> Separate ZFS media dataset (tank/media).
  #    EXCLUDED from routine config backup snapshots.
  # 3. Jellyfin & Immich Cache / Transcode Isolation:
  #    ${MEDIA_DIR:-~/media}/cache/...
  #    Keeps multi-GB transcode chunks and ML models OUT of ./configs so snapshots don't bloat.
  # 4. TRaSH Guides Hardlink Structure:
  #    Single shared root (${MEDIA_DIR:-~/media}:/data) across qBittorrent, Sonarr, and Radarr
  #    enables instant, zero-space atomic hardlinks from downloads to library folders.
  # --------------------------------------------------

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      LOG_LEVEL: info
      TZ: ${TZ:-UTC}
    ports:
      - "8191:8191"
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      <<: *common-env
      WEBUI_PORT: 8080
    volumes:
      - ./configs/qbittorrent:/config
      - ${MEDIA_DIR:-~/media}:/data
    ports:
      - "8080:8080" # WebUI
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      <<: *common-env
    volumes:
      - ./configs/prowlarr:/config
    ports:
      - "9696:9696"
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      <<: *common-env
    volumes:
      - ./configs/sonarr:/config
      - ${MEDIA_DIR:-~/media}:/data
    ports:
      - "8989:8989"
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      <<: *common-env
    volumes:
      - ./configs/radarr:/config
      - ${MEDIA_DIR:-~/media}:/data
    ports:
      - "7878:7878"
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      <<: *common-env
    volumes:
      - ./configs/bazarr:/config
      - ${MEDIA_DIR:-~/media}:/data
    ports:
      - "6767:6767"
    restart: unless-stopped

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      <<: *common-env
    volumes:
      - ./configs/jellyfin:/config
      - ${MEDIA_DIR:-~/media}/cache/jellyfin:/cache
      - ${MEDIA_DIR:-~/media}/movies:/data/movies:ro
      - ${MEDIA_DIR:-~/media}/tv:/data/tv:ro
    ports:
      - "8096:8096"
    # devices:
    #   - /dev/dri:/dev/dri # Intel QuickSync / VAAPI hardware transcoding
    restart: unless-stopped

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ./configs/jellyseerr:/app/config
    ports:
      - "5055:5055"
    restart: unless-stopped

